<div class="panel">
<!-- Toolbar: title, search and export -->
<div class="mb-5 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
        <h5 class="text-lg font-semibold dark:text-white-light">Manage Campaigns</h5>
        <p class="text-xs text-white-dark">{{ totalCampaigns }} {{ totalCampaigns === 1 ? 'campaign' : 'campaigns' }}</p>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative sm:w-64">
            <input [(ngModel)]="search" type="text" class="form-input ltr:pl-9 rtl:pr-9" placeholder="Search campaigns..."
                (input)="searchData()" />
            <icon-search class="pointer-events-none absolute top-1/2 h-4 w-4 -translate-y-1/2 text-white-dark ltr:left-3 rtl:right-3"></icon-search>
        </div>
        <button type="button" class="btn btn-success gap-2" (click)="exportTable('excel')">
            <icon-code-file class="h-4 w-4" />
            Export Excel
        </button>
    </div>
</div>

<!-- Filters -->
<form [formGroup]="form1" class="mb-5 grid grid-cols-1 gap-4 border-b border-white-light pb-5 dark:border-[#1b2e4b] sm:grid-cols-2 lg:grid-cols-4">
    <div>
        <label class="filter-label">Campaign</label>
        <ng-select class="filter-select" [items]="options" bindLabel="campaign_name" bindValue="id" placeholder="All campaigns"
            [(ngModel)]="selectedCampaignOption" [ngModelOptions]="{ standalone: true }" (change)="fetchData()">
        </ng-select>
    </div>
    <div>
        <label class="filter-label">Start Date</label>
        <ng2-flatpickr [config]="basic" formControlName="start_date" addClass="form-input" placeholder="YYYY-MM-DD"
            (ngModelChange)="fetchData()"></ng2-flatpickr>
    </div>
    <div>
        <label class="filter-label">End Date</label>
        <ng2-flatpickr [config]="basic" formControlName="end_date" addClass="form-input" placeholder="YYYY-MM-DD"
            (ngModelChange)="fetchData()"></ng2-flatpickr>
    </div>
    <div class="flex items-end">
        <button type="button" class="btn btn-outline-secondary w-full" [disabled]="!hasActiveFilters" (click)="resetFilters()">
            Reset Filters
        </button>
    </div>
</form>

<div class="table-responsive w-full overflow-x-auto">
    <ngx-datatable class="material striped datatable-compact" [rows]="rows" [columns]="columns" [columnMode]="columnMode" [headerHeight]="60"
        (sort)="onSort($event)" [footerHeight]="60" [rowHeight]="'auto'" [count]="totalCampaigns" [scrollbarH]="true"
        (scroll)="scheduleStickyUpdate()">

        <ngx-datatable-column name="Country" [flexGrow]="2" [width]="120" [minWidth]="100" [sortable]="true" prop="country_id">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <div class="truncate-text">
                    {{ row?.country?.name }}
                </div>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Banner Image" [flexGrow]="2" [width]="110" [minWidth]="100" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <div class="image-container">
                    <img [src]="row?.banner_image" [alt]="(row?.campaign_name || 'Campaign') + ' banner'" class="datatable-image" />
                </div>
            </ng-template>
        </ngx-datatable-column>

        <!-- Scrolls normally, then sticks to the left edge once scrolled to it (see updateStickyColumn) -->
        <ngx-datatable-column name="Campaign Name" cellClass="sticky-col" headerClass="sticky-col" [width]="200" [minWidth]="180"
            [sortable]="true" prop="campaign_name">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <div class="truncate-text font-semibold" [title]="row?.campaign_name || ''">
                    {{ row?.campaign_name }}
                </div>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Support Action" [flexGrow]="3" [width]="180" [minWidth]="160" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <button *ngIf="row?.is_approved === 1 && row?.is_support === 0" type="button" class="btn btn-primary btn-sm whitespace-nowrap"
                    (click)="toggleSupport(row.id, 1)">
                    Mark as Supported
                </button>

                <!-- Click again to undo (asks for confirmation) -->
                <button *ngIf="row?.is_approved === 1 && row?.is_support === 1" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                    title="Click to remove support status" (click)="toggleSupport(row.id, 0)">
                    Supported
                </button>

                <!-- Not available until the campaign is approved -->
                <button *ngIf="row?.is_approved !== 1" type="button" class="btn btn-success btn-sm whitespace-nowrap" disabled>
                    Supported
                </button>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Discoverability Action" [flexGrow]="3" [width]="190" [minWidth]="170" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <button *ngIf="row?.is_approved === 1 && row?.is_discover === 0" type="button" class="btn btn-primary btn-sm whitespace-nowrap"
                    (click)="toggleDiscover(row.id, 1)">
                    Mark as Discoverable
                </button>

                <!-- Click again to undo (asks for confirmation) -->
                <button *ngIf="row?.is_approved === 1 && row?.is_discover === 1" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                    title="Click to remove discoverability status" (click)="toggleDiscover(row.id, 0)">
                    Discoverable
                </button>

                <!-- Not available until the campaign is approved -->
                <button *ngIf="row?.is_approved !== 1" type="button" class="btn btn-success btn-sm whitespace-nowrap" disabled>
                    Discoverable
                </button>
            </ng-template>
        </ngx-datatable-column>
        
        <ngx-datatable-column name="Featured Action" [flexGrow]="3" [width]="160" [minWidth]="140" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <button *ngIf="row?.is_approved === 1 && row?.is_featured === 0" type="button" class="btn btn-primary btn-sm whitespace-nowrap"
                    (click)="toggleFeatured(row.id, 1)">
                    Mark as Featured
                </button>

                <!-- Click again to undo (asks for confirmation) -->
                <button *ngIf="row?.is_approved === 1 && row?.is_featured === 1" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                    title="Click to remove featured status" (click)="toggleFeatured(row.id, 0)">
                    Featured
                </button>

                <!-- Not available until the campaign is approved -->
                <button *ngIf="row?.is_approved !== 1" type="button" class="btn btn-success btn-sm whitespace-nowrap" disabled>
                    Featured
                </button>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Verification Action" [flexGrow]="3" [width]="170" [minWidth]="150" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <button *ngIf="row?.is_approved === 1 && row?.is_verified === 0" type="button" class="btn btn-primary btn-sm whitespace-nowrap"
                    (click)="toggleVerification(row.id, 1)">
                    Mark as Verified
                </button>

                <!-- Click again to undo (asks for confirmation) -->
                <button *ngIf="row?.is_approved === 1 && row?.is_verified === 1" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                    title="Click to remove verification status" (click)="toggleVerification(row.id, 0)">
                    Verified
                </button>

                <!-- Not available until the campaign is approved -->
                <button *ngIf="row?.is_approved !== 1" type="button" class="btn btn-success btn-sm whitespace-nowrap" disabled>
                    Verified
                </button>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Tax Benefits Action" [flexGrow]="3" [width]="190" [minWidth]="170" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <!-- Mark as Verified button, disabled if is_approved === 0 or 2 -->
                <button *ngIf="row?.is_tax_benefits === 0 && row?.is_approved === 1" type="button" class="btn btn-primary btn-sm whitespace-nowrap"
                    (click)="noTaxBenefitsCampaign(row.id)">
                    Mark as tax benefits
                </button>

                <!-- Verified button, always disabled if is_approved === 0 or 2 -->
                <button *ngIf="row?.is_tax_benefits === 1 || row?.is_approved !== 1" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                    [disabled]="row?.is_approved !== 1" (click)="taxBenefitsCampaign(row.id)">
                    Tax Benefits
                </button>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Status Action" [flexGrow]="2" [width]="140" [minWidth]="120" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <button *ngIf="row?.is_active === 1 && row?.is_approved !== 2" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                [disabled]="row?.is_approved !== 1"
                    (click)="activeCampaign(row.id)">
                    Active
                </button>

                <button *ngIf="row?.is_active === 0 && row?.is_approved !== 2" type="button" class="btn btn-danger btn-sm whitespace-nowrap"
                    (click)="inactiveCampaign(row.id)">
                    Inactive
                </button>

                <button *ngIf="row?.is_approved === 2" type="button" class="btn btn-secondary btn-sm whitespace-nowrap" disabled>
                    Status Disabled
                </button>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Approval Action" [flexGrow]="3" [width]="180" [minWidth]="160" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <!-- Action Button: Shows Approve/Reject dialog when status is Pending -->
                <button *ngIf="row?.is_approved === 0" type="button" class="btn btn-primary btn-sm whitespace-nowrap"
                    (click)="approveRejectCampaign(row.id)">
                    Approve / Reject
                </button>

                <!-- Approved Status Button: Disabled after approval -->
                <button *ngIf="row?.is_approved === 1" type="button" class="btn btn-success btn-sm whitespace-nowrap" disabled>
                    Approved
                </button>

                <!-- Rejected Status Button: Disabled after rejection -->
                <button *ngIf="row?.is_approved === 2" type="button" class="btn btn-danger btn-sm whitespace-nowrap" disabled>
                    Rejected
                </button>
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Created Date" [flexGrow]="2" [width]="130" [minWidth]="110" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.createdAt | date: 'yyyy-MM-dd' }}
            </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column name="Action" [flexGrow]="2" [width]="120" [minWidth]="100" [sortable]="false">
            <ng-template let-row="row" ngx-datatable-cell-template>
                <div class="flex items-center">
                    <div>
                        <button type="button" class="ltr:mr-2 rtl:ml-2" ngxTippy="Edit"
                            (click)="navigateToEditCampaign(row.id)">
                            <icon-pencil-paper />
                        </button>
                    </div>
                    <div>
                        <button type="button" class="ltr:mr-2 rtl:ml-2" ngxTippy="View"
                            [routerLink]="['/admin/campaign/campaign-details', row.id]">
                            <icon-eye />
                        </button>
                    </div>
                    <div>
                        <button type="button" ngxTippy="Delete" (click)="deleteCamaign(row.id)">
                            <icon-trash-lines />
                        </button>
                    </div>
                </div>
            </ng-template>
        </ngx-datatable-column>

    </ngx-datatable>
</div>

<!-- Display this message if no data is found -->
<!-- <div *ngIf="rows?.length === 0 && search !== ''" class="no-data-found-message">No data found</div> -->

<div class="container">
    <div class="pag-container">
        <div class="pagination-info">{{ getRange() }}</div>
        <select [(ngModel)]="per_page" (change)="changePerPage($event)" class="form-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
    </div>

    <div class="pagination-container">
        <button class="pagination-button" (click)="moveToFirstPage()"
            [disabled]="!totalCampaigns || page === 1">First</button>
        <button class="pagination-button" (click)="moveToPreviousPage()"
            [disabled]="!totalCampaigns || page === 1">Previous</button>
        <span class="pagination-info">Page {{ page }} of {{ totalPages }}</span>
        <button class="pagination-button" (click)="moveToNextPage()"
            [disabled]="!totalCampaigns || page === totalPages">Next</button>
        <button class="pagination-button" (click)="moveToLastPage()"
            [disabled]="!totalCampaigns || page === totalPages">Last</button>
    </div>
</div>
</div>
