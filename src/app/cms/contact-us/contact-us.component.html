<div class="panel">
<!-- Toolbar: title and search -->
<div class="mb-5 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
        <h5 class="text-lg font-semibold dark:text-white-light">Contact Us</h5>
        <p *ngIf="!(loading && !rows.length); else countLoading" class="text-xs text-white-dark">{{ totalContactInfo }} {{ totalContactInfo === 1 ? 'message' : 'messages' }}</p>
        <ng-template #countLoading><p class="text-xs text-white-dark">Loading…</p></ng-template>
    </div>
    <div class="relative sm:w-64">
        <input [(ngModel)]="search" type="text" class="form-input ltr:pl-9 rtl:pr-9" placeholder="Search messages..."
            (input)="searchData()" />
        <icon-search class="pointer-events-none absolute top-1/2 h-4 w-4 -translate-y-1/2 text-white-dark ltr:left-3 rtl:right-3"></icon-search>
    </div>
</div>

<!-- Skeleton while the first page of data loads; on later reloads the current rows are dimmed instead -->
<app-table-skeleton *ngIf="loading && !rows.length" [columns]="6"></app-table-skeleton>
<div class="table-responsive w-full overflow-x-auto transition-opacity" [class.table-is-loading]="loading && !rows.length"
    [class.opacity-50]="loading && rows.length">
<ngx-datatable class="material striped datatable-compact" [rows]="rows" [columns]="columns" [columnMode]="columnMode" [headerHeight]="50"
    [footerHeight]="50" [rowHeight]="'auto'" [externalSorting]="false" [count]="totalContactInfo" [scrollbarH]="true">

    <!-- First and last name together -->
    <ngx-datatable-column name="Name" [width]="170" [minWidth]="140" [sortable]="true" prop="first_name">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <a class="break-words font-semibold text-black hover:text-primary hover:underline dark:text-white-light dark:hover:text-primary"
                [title]="fullName(row)" [routerLink]="['/admin/cms/contact-details', row.id]">{{ fullName(row) || '—' }}</a>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Email" [width]="210" [minWidth]="170" [sortable]="true" prop="email">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="break-all" [title]="row?.email || ''">{{ row?.email }}</span>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Subject" [width]="200" [minWidth]="150" [sortable]="true" prop="subject">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="line-clamp-2" [title]="row?.subject || ''">{{ row?.subject }}</span>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Message" [width]="320" [minWidth]="200" [sortable]="true" prop="description">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="line-clamp-2" [title]="row?.description || ''">{{ row?.description }}</span>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Received" [width]="120" [canAutoResize]="false" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row?.createdAt | date: 'yyyy-MM-dd' }}
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Action" [width]="80" [canAutoResize]="false" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <button type="button" ngxTippy="View" [routerLink]="['/admin/cms/contact-details', row.id]">
                <icon-eye></icon-eye>
            </button>
        </ng-template>
    </ngx-datatable-column>

</ngx-datatable>
</div>

<!-- Pagination Controls -->
<div class="container">
    <div class="pag-container">
        <div class="pagination-info">{{ getRange() }}</div>
        <select [(ngModel)]="per_page" (change)="changePerPage()" class="form-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
    </div>

    <div class="pagination-container">
        <button class="pagination-button" (click)="moveToFirstPage()" [disabled]="!totalContactInfo || page === 1">First</button>
        <button class="pagination-button" (click)="moveToPreviousPage()" [disabled]="!totalContactInfo || page === 1">Previous</button>
        <span class="pagination-info">Page {{ page }} of {{ totalPages }}</span>
        <button class="pagination-button" (click)="moveToNextPage()" [disabled]="!totalContactInfo || page === totalPages">Next</button>
        <button class="pagination-button" (click)="moveToLastPage()" [disabled]="!totalContactInfo || page === totalPages">Last</button>
    </div>
</div>
</div>
