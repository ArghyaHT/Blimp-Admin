<div class="panel">
<!-- Toolbar: title, search and add -->
<div class="mb-5 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
        <h5 class="text-lg font-semibold dark:text-white-light">FAQ</h5>
        <p *ngIf="!(loading && !rows.length); else countLoading" class="text-xs text-white-dark">{{ totalFaq }} {{ totalFaq === 1 ? 'question' : 'questions' }}</p>
        <ng-template #countLoading><p class="text-xs text-white-dark">Loading…</p></ng-template>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative sm:w-64">
            <input [(ngModel)]="search" type="text" class="form-input ltr:pl-9 rtl:pr-9" placeholder="Search FAQs..."
                (input)="searchData()" />
            <icon-search class="pointer-events-none absolute top-1/2 h-4 w-4 -translate-y-1/2 text-white-dark ltr:left-3 rtl:right-3"></icon-search>
        </div>
        <button type="button" class="btn btn-success gap-2" (click)="navigateToAddFaq()">
            <icon-plus class="h-4 w-4"></icon-plus>
            Add FAQ
        </button>
    </div>
</div>

<!-- English question/answer, plus one badge per language showing which translations are complete -->
<!-- Skeleton while the first page of data loads; on later reloads the current rows are dimmed instead -->
<app-table-skeleton *ngIf="loading && !rows.length" [columns]="5"></app-table-skeleton>
<div class="table-responsive w-full overflow-x-auto transition-opacity" [class.table-is-loading]="loading && !rows.length"
    [class.opacity-50]="loading && rows.length">
<ngx-datatable class="material striped datatable-compact" [rows]="rows" [columns]="columns" [columnMode]="columnMode" [headerHeight]="50"
    [footerHeight]="50" [rowHeight]="'auto'" (sort)="onSort($event)" [count]="totalFaq" [scrollbarH]="true">

    <ngx-datatable-column name="Question" [width]="280" [minWidth]="200" [sortable]="true" prop="question_en">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <a class="line-clamp-2 font-semibold text-black hover:text-primary hover:underline dark:text-white-light dark:hover:text-primary"
                [title]="row?.question_en || ''" [routerLink]="['/admin/cms/faq-details', row.id]">{{ row?.question_en || '—' }}</a>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Answer" [width]="360" [minWidth]="220" [sortable]="true" prop="answer_en">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="line-clamp-2" [title]="row?.answer_en || ''">{{ row?.answer_en || '—' }}</span>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Translations" [width]="170" [canAutoResize]="false" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <div class="flex flex-wrap gap-1">
                <span *ngFor="let language of translations(row)" class="badge !my-0 !px-1.5"
                    [ngClass]="language.done ? 'badge-outline-success' : 'badge-outline-secondary opacity-60'"
                    [title]="language.code + (language.done ? ': question and answer added' : ': missing')">{{ language.code }}</span>
            </div>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Status Action" [width]="130" [canAutoResize]="false" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <button *ngIf="row?.is_active == 1" type="button" class="btn btn-success btn-sm whitespace-nowrap"
                (click)="toggleFAQStatus(row.id, true)">Active</button>
            <button *ngIf="row?.is_active == 0" type="button" class="btn btn-danger btn-sm whitespace-nowrap"
                (click)="toggleFAQStatus(row.id, false)">InActive</button>
        </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Action" [width]="120" [canAutoResize]="false" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <div class="flex items-center gap-3">
                <button type="button" ngxTippy="View" [routerLink]="['/admin/cms/faq-details', row.id]">
                    <icon-eye></icon-eye>
                </button>
                <button type="button" ngxTippy="Edit" (click)="navigateToEditFaq(row.id)">
                    <icon-pencil-paper></icon-pencil-paper>
                </button>
                <button type="button" ngxTippy="Delete" (click)="deleteFAQ(row.id)">
                    <icon-trash-lines></icon-trash-lines>
                </button>
            </div>
        </ng-template>
    </ngx-datatable-column>

</ngx-datatable>
</div>

<!-- Pagination Controls -->
<div class="container">
    <div class="pag-container">
        <div class="pagination-info">{{ getRange() }}</div>
        <select [(ngModel)]="per_page" (change)="changePerPage($event)" class="form-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
    </div>

    <div class="pagination-container">
        <button class="pagination-button" (click)="moveToFirstPage()"
            [disabled]="!totalFaq || page === 1">First</button>
        <button class="pagination-button" (click)="moveToPreviousPage()"
            [disabled]="!totalFaq || page === 1">Previous</button>
        <span class="pagination-info">Page {{ page }} of {{ totalPages }}</span>
        <button class="pagination-button" (click)="moveToNextPage()"
            [disabled]="!totalFaq || page === totalPages">Next</button>
        <button class="pagination-button" (click)="moveToLastPage()"
            [disabled]="!totalFaq || page === totalPages">Last</button>
    </div>
</div>
</div>
