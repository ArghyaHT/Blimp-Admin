<div class="panel">
    <a routerLink="/admin/cms/faq" class="mb-4 inline-flex items-center gap-1.5 text-xs font-semibold text-white-dark hover:text-primary">
        <icon-arrow-left class="h-4 w-4 ltr:rotate-180"></icon-arrow-left>
        Back to FAQ
    </a>
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
            <h5 class="text-lg font-semibold dark:text-white-light">Edit FAQ</h5>
            <p class="text-xs text-white-dark">
                Add the question and answer in every language.
                Fields marked with <span class="required-mark" aria-hidden="true">*</span> are required.
            </p>
        </div>
        <a *ngIf="faqId" [routerLink]="['/admin/cms/faq-details', faqId]" class="btn btn-outline-primary shrink-0 gap-2">
            <icon-eye class="h-4 w-4"></icon-eye>
            View Details
        </a>
    </div>

    <form [formGroup]="editFaqForm" (ngSubmit)="editFAQ()">
        <!-- Language tabs; a red dot marks a language with missing fields -->
        <div class="mb-6 flex flex-wrap gap-1 border-b border-white-light dark:border-[#1b2e4b]" role="tablist" aria-label="Language">
            <button *ngFor="let language of faqLanguages" type="button" role="tab" class="lang-tab"
                [id]="'tab-' + language.code" [attr.aria-controls]="'panel-' + language.code"
                [attr.aria-selected]="activeLang === language.code" [class.lang-tab-active]="activeLang === language.code"
                (click)="activeLang = language.code">
                {{ language.label }}
                <span *ngIf="langHasError(language.code)" class="ml-1 inline-block h-1.5 w-1.5 rounded-full bg-danger align-middle" title="Has missing fields"></span>
            </button>
        </div>

        <div *ngFor="let language of faqLanguages" role="tabpanel" [id]="'panel-' + language.code"
            [attr.aria-labelledby]="'tab-' + language.code" [hidden]="activeLang !== language.code">
            <div class="grid grid-cols-1 gap-y-5">
                <div>
                    <label [for]="'question_' + language.code">Question ({{ language.label }})<span class="required-mark" aria-hidden="true">*</span></label>
                    <textarea [id]="'question_' + language.code" [formControlName]="'question_' + language.code"
                        [placeholder]="'Question in ' + language.label" class="form-textarea" rows="2" aria-required="true"></textarea>
                    <p class="field-error" *ngIf="editFaqF['question_' + language.code].invalid && (is_submited || editFaqF['question_' + language.code].touched)">
                        Please provide a question in {{ language.label }}
                    </p>
                </div>
                <div>
                    <label [for]="'answer_' + language.code">Answer ({{ language.label }})<span class="required-mark" aria-hidden="true">*</span></label>
                    <textarea [id]="'answer_' + language.code" [formControlName]="'answer_' + language.code"
                        [placeholder]="'Answer in ' + language.label" class="form-textarea" rows="7" aria-required="true"></textarea>
                    <p class="field-error" *ngIf="editFaqF['answer_' + language.code].invalid && (is_submited || editFaqF['answer_' + language.code].touched)">
                        Please provide an answer in {{ language.label }}
                    </p>
                </div>
            </div>
        </div>

        <div class="mt-8 flex items-center justify-end gap-3 border-t border-white-light pt-5 dark:border-[#1b2e4b]">
            <button type="button" class="btn btn-outline-danger" (click)="cancel()">Cancel</button>
            <button type="submit" class="btn btn-success">Update FAQ</button>
        </div>
    </form>
</div>
