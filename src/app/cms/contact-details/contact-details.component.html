<div class="panel">
    <div class="mb-5 flex items-center justify-between">
        <button class="btn btn-success !mt-6" routerLink="/admin/cms/contact-us">Back</button>

    </div>
    <div class="mt-8 px-4">
        <div class="flex flex-col justify-between lg:flex-row" *ngIf="contactData">
            <div class="mb-6 w-full lg:w-3/5 ltr:lg:mr-6 rtl:lg:ml-6">
                <div class="text-lg font-bold mb-3">Customer Contact Details</div>
                <!-- <div class="mt-4 flex items-center">
                    <label for="reciever-name" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">Id</label>
                    <h4 id="id" class="form-input flex-1">{{contactData?.id}}</h4>
                </div> -->
                <div class="mt-4 flex items-center">
                    <label for="reciever-email" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2 bold-label">First Name</label>
                    <h4 id="name" class="form-input flex-1">{{contactData?.first_name}}</h4>
                </div>
                <div class="mt-4 flex items-center">
                    <label for="reciever-number" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2 bold-label">Last Name</label>
                    <h4 id="code" class="form-input flex-1">{{contactData?.last_name}}</h4>
                </div>
                <div class="mt-4 flex items-center">
                    <label for="reciever-address" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2 bold-label">Email</label>
                    <h4 id="email" class="form-input flex-1">{{contactData?.email}}</h4>
                </div>
                <div class="mt-4 flex items-center">
                    <label for="reciever-number" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2 bold-label">Subject</label>
                    <h4 id="number" class="form-input flex-1">{{contactData?.subject}}</h4>
                </div>
                <div class="mt-4 flex items-center">
                    <label for="reciever-number" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2 bold-label">Description</label>
                    <h4 id="userType" class="form-input flex-1">{{contactData?.description}}</h4>
                </div>
            </div>
        </div>
    </div>
</div>
