<!-- Page header: title + period filter -->
<div class="mb-6 flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
    <div>
        <h5 class="text-xl font-semibold dark:text-white-light">Dashboard</h5>
        <p class="text-sm text-white-dark">Overview of customers, campaigns and funds</p>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-end">
        <div>
            <label for="filter" class="filter-label">Period</label>
            <select id="filter" class="form-select sm:w-44" [(ngModel)]="selectedFilterType" (change)="onFilterChange()">
                <option *ngFor="let option of filterOptions" [value]="option.value">{{ option.value ? option.label : 'All time' }}</option>
            </select>
        </div>

        <ng-container *ngIf="selectedFilterType === 'custom'">
            <div>
                <label for="startDate" class="filter-label">Start Date</label>
                <input id="startDate" type="date" class="form-input sm:w-44" [(ngModel)]="startDate" />
            </div>
            <div>
                <label for="endDate" class="filter-label">End Date</label>
                <input id="endDate" type="date" class="form-input sm:w-44" [(ngModel)]="endDate" />
            </div>
        </ng-container>

        <button type="button" class="btn btn-primary" [disabled]="loading" (click)="fetchDashboardData()">
            <span *ngIf="loading" class="btn-spinner"></span>
            {{ loading ? 'Please wait...' : 'Apply Filter' }}
        </button>
    </div>
</div>

<!-- Stat cards, grouped -->
<ng-container *ngFor="let group of statGroups">
    <h6 class="mb-3 text-xs font-semibold uppercase tracking-wider text-white-dark">{{ group.title }}</h6>
    <div class="mb-6 grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3">
        <div *ngFor="let card of group.cards" class="panel flex items-center justify-between gap-4"
            [class.stat-card]="card.route" [class.cursor-pointer]="card.route" [attr.role]="card.route ? 'button' : null"
            [attr.tabindex]="card.route ? 0 : null" (click)="openCard(card.route)" (keydown.enter)="openCard(card.route)">
            <div class="min-w-0">
                <p class="text-sm font-semibold text-white-dark">{{ card.label }}</p>
                <!-- Short form (e.g. 1.3K, 1.3M); exact value on hover -->
                <!-- Placeholder bar while the stats load (first load and after Apply Filter) -->
                <div *ngIf="loading" class="mt-3 h-8 w-24 animate-pulse rounded bg-[#e0e6ed] dark:bg-[#1b2e4b]" aria-hidden="true"></div>
                <p *ngIf="!loading" class="mt-2 truncate text-3xl font-bold text-black dark:text-white-light"
                    [title]="dashboardData ? (dashboardData[card.key] ?? 0 | number: card.format) : ''">
                    {{ dashboardData ? compactNumber(dashboardData[card.key]) : '—' }}
                </p>
            </div>
            <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl text-2xl" [ngClass]="card.iconClass">
                <i class="fas" [ngClass]="card.icon"></i>
            </div>
        </div>
    </div>
</ng-container>
