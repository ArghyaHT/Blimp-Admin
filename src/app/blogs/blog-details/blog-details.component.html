<div class="panel">
    <div class="mb-5 flex items-center justify-between">
        <button class="btn btn-success mt-6" routerLink="/admin/blogs">Back</button>
    </div>
    <div class="mt-8 px-4">
        <div class="flex flex-col lg:flex-row" *ngIf="blogData">
            <div class="mb-6 w-full lg:w-3/5 ltr:lg:mr-6 rtl:lg:ml-6">
                <div class="text-lg font-bold mb-3">Blog Details</div>
                
                <!-- Blog Image -->
                <div class="mt-4 flex items-center">
                    <label for="blog-image" class="bold-label w-1/3 ltr:mr-2 rtl:ml-2">Blog Image</label>
                    <img [src]="blogData?.blogs_image" alt="Blog Image" class="form-input flex-1" style="width:10%;" />
                </div>
                
                <!-- Blog Title -->
                <div class="mt-4 flex items-center">
                    <label for="blog-title" class="bold-label w-1/3 ltr:mr-2 rtl:ml-2">Blog Title</label>
                    <h4 id="blog-title" class="form-input flex-1">{{blogData?.blogs_title}}</h4>
                </div>
                
                <!-- Blog Description -->
                <div class="mt-4 flex items-center">
                    <label for="blog-description" class="bold-label w-1/3 ltr:mr-2 rtl:ml-2">Blog Description</label>
                    <h4 id="blog-description" class="form-input flex-1">{{blogData?.blogs_description}}</h4>
                </div>

                <div class="mt-4 flex items-center">
                    <label class="bold-label w-1/3 ltr:mr-2 rtl:ml-2">Status</label>
                    <h4 id="createdAt" class="form-input flex-1">{{blogData?.is_active | Status  }}</h4>
                </div>
                
                <div class="mt-4 flex items-center" *ngIf="blogData?.adminData">
                    <label class="bold-label w-1/3 ltr:mr-2 rtl:ml-2">Update Employee Name</label>
                    <h4 id="name" class="form-input flex-1">{{blogData?.adminData?.firstname}}</h4>
                </div>
                
                <!-- Created At -->
                <div class="mt-4 flex items-center">
                    <label for="created-at" class="bold-label w-1/3 ltr:mr-2 rtl:ml-2">Created At</label>
                    <h4 id="created-at" class="form-input flex-1">{{blogData?.createdAt | date: 'yyyy-MM-dd'}}</h4>
                </div>

            </div>
        </div>
    </div>
</div>
